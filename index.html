<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeHub - Smart Home System</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #333; }
        .hidden { display: none; }
        input, select, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .danger-btn { background-color: #dc3545; }
        .danger-btn:hover { background-color: #c82333; }
        
        .dashboard-cards { display: flex; gap: 10px; margin-bottom: 20px; }
        .card { flex: 1; background: #e9ecef; padding: 15px; border-radius: 8px; text-align: center; }
        
        .device-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .device-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #fafafa; }
        .device-card h4 { margin: 0 0 10px 0; }
        
        .audit-log { max-height: 200px; overflow-y: auto; background: #222; color: #0f0; padding: 10px; border-radius: 5px; font-family: monospace; margin-top: 20px; }
        .log-entry { margin: 5px 0; border-bottom: 1px dashed #444; padding-bottom: 5px;}
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #343a40; color: white; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; color: #007bff;">HomeHub System</h1>

    <div id="authSection">
        <h2>Authentication System</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <br>
        <button onclick="login()">Login</button>
        <button onclick="register()" style="background-color: #28a745;">Register New User</button>
        <p id="authError" style="color: red;"></p>
    </div>

    <div id="workspaceSection" class="hidden">
        <h2>Welcome, <span id="displayUsername"></span></h2>
        <h3>Home Workspace Management</h3>
        <input type="text" id="roomIdInput" placeholder="Enter Home ID (e.g., home123)">
        <button onclick="joinHome()">Create / Join Home</button>
    </div>

    <div id="homeSection" class="hidden">
        <div class="top-bar">
            <div>Current Home: <strong id="currentRoomDisplay"></strong></div>
            <div>Users Online: <span id="onlineUsersCount">1</span></div>
            <button class="danger-btn" onclick="leaveHome()">Leave Home</button>
        </div>

        <h3>Status Dashboard</h3>
        <div class="dashboard-cards">
            <div class="card">Active Lights: <strong id="activeLights">0</strong></div>
            <div class="card">Average Temp: <strong id="avgTemp">0</strong>°C</div>
            <div class="card">Security Status: <strong id="securityStatus">Secure</strong></div>
        </div>

        <hr>

        <h3>Virtual Device Management</h3>
        <div>
            <input type="text" id="deviceName" placeholder="Device Name (e.g., Living Room)">
            <select id="deviceType">
                <option value="light">Smart Light</option>
                <option value="thermostat">Thermostat</option>
                <option value="lock">Smart Lock</option>
            </select>
            <button onclick="addDevice()">Add Device</button>
        </div>

        <div class="device-list" id="devicesContainer">
            </div>

        <hr>

        <h3>Activity Audit Log</h3>
        <div class="audit-log" id="auditLogContainer">
            </div>
    </div>
</div>

<script>
    // Automatically uses the correct URL and Port (e.g., http://localhost:3000)
    const API_URL = window.location.origin;
    let socket;
    let currentUser = '';
    let currentRoom = '';
    let localDevices = [];

    // --- Authentication ---
    async function register() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        if (!user || !pass) return alert("Please enter both username and password");
        
        try {
            const res = await fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await res.json();
            if(res.ok) alert(data.message || "Registration successful!");
            else document.getElementById('authError').innerText = data.error;
        } catch (err) {
            console.error(err);
            alert("Error connecting to server");
        }
    }

    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        if (!user || !pass) return alert("Please enter both username and password");

        try {
            const res = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await res.json();
            if(res.ok) {
                currentUser = data.username;
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('workspaceSection').classList.remove('hidden');
                document.getElementById('displayUsername').innerText = currentUser;
                document.getElementById('authError').innerText = '';
            } else {
                document.getElementById('authError').innerText = data.error;
            }
        } catch (err) {
            console.error(err);
            alert("Error connecting to server");
        }
    }

    // --- Workspace Management ---
    function joinHome() {
        currentRoom = document.getElementById('roomIdInput').value;
        if(!currentRoom) return alert("Please enter a Home ID");

        document.getElementById('workspaceSection').classList.add('hidden');
        document.getElementById('homeSection').classList.remove('hidden');
        document.getElementById('currentRoomDisplay').innerText = currentRoom;

        // Initialize Socket Connection
        socket = io(API_URL);

        socket.emit('joinHome', { username: currentUser, roomId: currentRoom });

        // Listen for events
        socket.on('homeData', (data) => {
            localDevices = data.devices;
            renderDevices();
            renderLogs(data.auditLogs);
            updateDashboard();
        });

        socket.on('activeUsersUpdated', (users) => {
            document.getElementById('onlineUsersCount').innerText = users.length;
        });

        socket.on('homeLayoutUpdated', (devices) => {
            localDevices = devices;
            renderDevices();
            updateDashboard();
        });

        socket.on('deviceUpdated', (updatedDevice) => {
            const index = localDevices.findIndex(d => d.id === updatedDevice.id);
            if (index !== -1) {
                localDevices[index] = updatedDevice;
                renderDevices();
                updateDashboard();
            }
        });

        socket.on('newAuditLog', (log) => {
            addLogEntry(log);
        });
    }

    function leaveHome() {
        window.location.reload();
    }

    // --- Device Management ---
    function addDevice() {
        const name = document.getElementById('deviceName').value;
        const type = document.getElementById('deviceType').value;
        if(!name) return alert("Device name is required");

        let defaultStatus = type === 'thermostat' ? 22 : false; 

        const newDevice = {
            id: Date.now().toString(),
            name,
            type,
            status: defaultStatus
        };

        socket.emit('addDevice', { roomId: currentRoom, device: newDevice });
        document.getElementById('deviceName').value = '';
    }

    function removeDevice(deviceId) {
        socket.emit('removeDevice', { roomId: currentRoom, deviceId });
    }

    function toggleDevice(deviceId) {
        socket.emit('deviceAction', { roomId: currentRoom, deviceId, action: 'toggle', username: currentUser });
    }

    function setDeviceValue(deviceId, val) {
        socket.emit('deviceAction', { roomId: currentRoom, deviceId, action: 'setValue', val: val, username: currentUser });
    }

    // --- UI Rendering ---
    function renderDevices() {
        const container = document.getElementById('devicesContainer');
        container.innerHTML = '';

        localDevices.forEach(dev => {
            let controls = '';
            
            if (dev.type === 'light') {
                const statusText = dev.status ? '💡 On' : '⚫ Off';
                controls = `<button onclick="toggleDevice('${dev.id}')">Toggle (${statusText})</button>`;
            } else if (dev.type === 'lock') {
                const statusText = dev.status ? '🔒 Locked' : '🔓 Unlocked';
                controls = `<button onclick="toggleDevice('${dev.id}')">Toggle (${statusText})</button>`;
            } else if (dev.type === 'thermostat') {
                controls = `
                    <div>Current Temp: ${dev.status}°C</div>
                    <input type="range" min="10" max="30" value="${dev.status}" onchange="setDeviceValue('${dev.id}', this.value)">
                `;
            }

            container.innerHTML += `
                <div class="device-card">
                    <h4>${dev.name} <small>(${dev.type})</small></h4>
                    ${controls}
                    <br><br>
                    <button class="danger-btn" onclick="removeDevice('${dev.id}')" style="width: 100%; font-size: 12px;">Remove Device</button>
                </div>
            `;
        });
    }

    // --- Dashboard & Audit Log ---
    function updateDashboard() {
        const lights = localDevices.filter(d => d.type === 'light');
        const activeLightsCount = lights.filter(l => l.status === true).length;
        document.getElementById('activeLights').innerText = `${activeLightsCount} / ${lights.length}`;

        const thermostats = localDevices.filter(d => d.type === 'thermostat');
        const totalTemp = thermostats.reduce((sum, t) => sum + Number(t.status), 0);
        const avgTemp = thermostats.length ? (totalTemp / thermostats.length).toFixed(1) : 0;
        document.getElementById('avgTemp').innerText = avgTemp;

        const locks = localDevices.filter(d => d.type === 'lock');
        const isSecure = locks.length === 0 || locks.every(l => l.status === true);
        const secStatusEl = document.getElementById('securityStatus');
        secStatusEl.innerText = isSecure ? (locks.length ? 'Secure 🔒' : 'No Locks') : 'Not Secure 🔓';
        secStatusEl.style.color = isSecure ? 'green' : 'red';
    }

    function renderLogs(logs) {
        const container = document.getElementById('auditLogContainer');
        container.innerHTML = '';
        logs.forEach(log => addLogEntry(log, false));
    }

    function addLogEntry(log, autoScroll = true) {
        const container = document.getElementById('auditLogContainer');
        const time = new Date(log.timestamp).toLocaleTimeString();
        let stateStr = typeof log.newState === 'boolean' 
            ? (log.newState ? 'On / Locked' : 'Off / Unlocked') 
            : log.newState;
            
        container.innerHTML += `<div class="log-entry">[${time}] User <b>${log.user}</b> changed <b>${log.device}</b> state to: ${stateStr}</div>`;
        
        if(autoScroll) container.scrollTop = container.scrollHeight;
    }
</script>
</body>
</html>
